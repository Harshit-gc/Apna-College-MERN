<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Block Element -->
     <!-- Takes Entire Width of a line -->
     <h3><u>Block Element</u></h3>
     <h1>Hello World</h1>
     <h1>Apna College</h1>
     <hr>

    <!-- Inline Element -->
     <h3><u>Inline Element</u></h3>
      <a href="">Google</a>
      <a href="">Youtube</a>
      <hr>

    <!-- DIV ELEMENT -->
     <h3><u>Div Element</u></h3>
     <div style="background-color: orangered;">
        <a href="">Google</a>
        <a href="">Youtube</a>
     </div>
     <a href="">Facebook</a>
     <hr>
     
    <!-- DIV ELEMENT -->
     <h3><u>Span Element</u></h3>
     <span style="background-color: orangered;">
        <a href="">Google</a>
        <a href="">Youtube</a>
     </span>
     <a href="">Facebook</a>
     <hr>

    <!-- Hr Tag(Horizontal Rule Element) -->
     <h3><u>Hr Tag</u></h3>
     <hr>
     <hr>

    <!-- SUB & SUP TAG -->
     <h3><u>Sub and Sup Tag</u></h3>
     <p>a<sup>2</sup> = b <sup>2</sup> + c <sup>2</sup></p>
     <p>H<sub>2</sub>O</p>
     <hr>
     
     
</body>
</html>
