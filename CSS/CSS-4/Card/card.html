<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="card.css">
    <title>Card Hover Effect</title>
</head>
<body>
    <div class="card">
        <img src="Male.png" alt="Image" />
        <div class="desc">
            <h3>Nikhil Sharma</h3>
            <p>Sr. Project Manager</p>
        </div>
    </div>
    <div class="card">
        <img src="Female.png" alt="Image">
        <div class="desc">
            <h3>Upasana Sharma</h3>
            <p>Sr. Event Manager</p>
        </div>
    </div>
</body>
</html>
